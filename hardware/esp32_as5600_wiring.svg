<text x="880" y="172" font-size="14" font-weight="bold" fill="#d62728">3V3 → VCC</text>
<text x="660" y="588" font-size="14" font-weight="bold" fill="#222222">GND → GND, DIR</text>
<text x="440" y="178" font-size="14" font-weight="bold" fill="#2ca02c">GPIO22 → SCL</text>
<text x="440" y="286" font-size="14" font-weight="bold" fill="#1f77b4">GPIO21 → SDA</text>
<text x="654" y="364" font-size="11" fill="#555">● = 연결점</text>
<text x="60" y="760" font-size="14" fill="#333">· 굵은 노란 테두리 핀만 연결. OUT·GPO는 비워 둠</text>
<text x="60" y="788" font-size="14" fill="#333">· ESP32 오른쪽 GND는 아래에서 두 번째, 3V3는 맨 아래 (VIN·5V 아님)</text>
<text x="60" y="816" font-size="14" fill="#333">· DIR을 GND에 묶으면 시계방향 회전 시 값 증가</text>
<text x="60" y="844" font-size="14" fill="#333">· 보드마다 핀 배치가 다를 수 있으니 실크 인쇄 이름(D21, D22, 3V3, GND)으로 확인</text>
<text x="60" y="872" font-size="14" fill="#333">· 전자석은 MOSFET·플라이백 다이오드를 거쳐 별도 전원으로, GND만 공통</text>
</svg>